:root{--paper:#f2ead8;--card:#f8f2e4;--ink:#34251b;--soft:#7a6450;--red:#a5372a;--line:#d9ccb2}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Lora',Georgia,serif;}
body{background-image:radial-gradient(rgba(120,90,50,.06) 1px,transparent 1.4px);background-size:7px 7px;}
main{max-width:660px;margin:0 auto;padding:18px 16px 60px}
h1{font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,52px);line-height:1;margin:18px 0 6px;letter-spacing:.5px}
h2{font-family:'Gloock',Georgia,serif;font-weight:400;font-size:clamp(28px,6.5vw,38px);margin:4px 0 0;line-height:1.05}
p{line-height:1.55;font-size:17px;margin:.6em 0}
.kicker{font-family:'Atk',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.names{font-family:Georgia,'Times New Roman',serif;color:var(--soft);font-size:15px;margin:4px 0 0;line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px 20px;box-shadow:0 2px 0 rgba(80,60,30,.06),0 10px 30px -18px rgba(80,60,30,.35);position:relative}
.plate{position:relative;display:flex;justify-content:center;margin:2px -6px 6px}
.pw{position:relative;display:inline-block;max-width:100%}
.pw img{display:block;max-width:100%;max-height:min(48vh,440px);width:auto;height:auto}
.pw svg.marks{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.marks path,.marks line{fill:none;stroke:var(--red);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.marks text{font-family:'Lora',Georgia,serif;font-style:italic;fill:var(--red);paint-order:stroke;stroke:var(--card);stroke-width:5px;stroke-linejoin:round}
.marks .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s ease-out forwards}
.marks text{opacity:0;animation:fade .4s .45s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
.q{font-family:'Gloock',Georgia,serif;font-size:21px;margin:16px 0 10px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.btns button{font-family:'Atk',sans-serif;font-size:15px;color:var(--ink);background:#fbf7ee;border:1.5px solid var(--ink);border-radius:8px;padding:10px 6px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 2px 0 var(--ink);transition:transform .08s}
.btns button:active{transform:translateY(2px);box-shadow:0 0 0 var(--ink)}
.btns button svg{width:58px;height:40px}
.btns button svg *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btns button svg .soil{stroke:var(--soft);stroke-width:1.2;stroke-dasharray:1.5 3.2}
.hint{font-size:14.5px;color:var(--soft);font-style:italic;margin:10px 2px 0}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}
.stamp{flex:none;font-family:'Gloock',Georgia,serif;color:var(--red);font-size:clamp(22px,5.5vw,28px);letter-spacing:.12em;padding:4px 11px 2px;margin-right:4px;border:3px double var(--red);border-radius:6px;transform:rotate(-9deg) scale(1);opacity:.88;mix-blend-mode:multiply;animation:thump .28s cubic-bezier(.2,1.6,.4,1);background:rgba(248,242,228,.55)}
@keyframes thump{from{transform:rotate(-9deg) scale(1.9);opacity:0}}
.verdict{font-family:'Gloock',Georgia,serif;font-size:22px;margin:14px 0 2px}
.sub{font-style:italic;color:var(--soft);margin:0 0 6px}
.lab{font-family:'Atk',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:16px 0 2px}
.gauge{display:flex;gap:10px;align-items:flex-start;margin:6px 0}
.gauge svg{flex:none;width:60px;height:19px;margin-top:3px}
.gauge p{margin:0;font-size:16px}
.careful{border-left:3px solid var(--red);padding:2px 0 2px 12px;margin:14px 0 4px}
.careful p{margin:0;font-size:16px}
.aside{font-style:italic;margin-top:16px}
.next{font-family:'Atk',sans-serif;font-size:16px;margin-top:18px;width:100%;padding:13px;background:var(--ink);color:var(--card);border:0;border-radius:8px;cursor:pointer}
.legend{font-size:14.5px;color:var(--soft)}
.legend div{display:flex;gap:8px;align-items:center;margin:3px 0}
.legend svg{width:52px;height:16px;flex:none}
table{width:100%;border-collapse:collapse;font-size:15.5px;margin:10px 0}
td{padding:6px 4px;border-bottom:1px solid var(--line)}
td.r{text-align:right;font-family:'Atk',sans-serif;font-size:13px;letter-spacing:.06em}
.ok{color:#3d6b35}.no{color:var(--red)}.half{color:#9a6b1f}
.tally{font-family:'Gloock',Georgia,serif;font-size:24px;margin:8px 0}
footer{font-size:13.5px;color:var(--soft);margin-top:26px;line-height:1.5}
.reveal{display:none}.answered .reveal{display:block}.answered .ask{display:none}
</style></head>

<script>
const CARDS=[{"id": "potato", "name": "potato", "kind": "stem", "sub": "a tuber: the swollen tip of an underground runner", "names": ["kentang (id, my)", "man farang (th)", "patatas (ph)", "khoai tây (vn)"], "marks": [{"x": 551, "y": 267, "r": 24, "t": "a bud", "lx": 640, "ly": 200}, {"x": 456, "y": 382, "r": 24, "t": "another", "lx": 360, "ly": 470}], "tell": "eyes. every eye is a bud, and they spiral round the potato, crowded at one end. buds in rows mean stem. this is a stem that grew on the end of a runner and swelled up with starch.", "miss": {"root": "it's the most famous root that isn't one.", "leaves": "no layers in there. cut one and it's solid all the way through."}, "pot": "boiled, fried, perkedel (indonesian potato fritters), every soup that needs bulk.", "sure": [[3, "vitamin c and potassium, in real amounts. keep the skin for the fibre."]], "safe": "green skin or long sprouts mean solanine. cut the green away generously, or skip that one.", "line": "the first one out of the sack was a stem. the Council took this well."}, {"id": "sweetpotato", "name": "sweet potato", "kind": "root", "sub": "a tuberous root, morning glory family", "names": ["ubi jalar (id)", "keledek (my)", "man thet (th)", "kamote (ph)", "khoai lang (vn)"], "marks": [{"x": 845, "y": 300, "r": 26, "t": "a tail", "lx": 740, "ly": 225}, {"x": 450, "y": 475, "r": 34, "t": "hairs", "lx": 600, "ly": 520}], "tell": "no eyes in rows. hairs, and a tail at the far end. it's a root that filled itself with sugar, and it's only a distant cousin of the potato: same order, different family.", "miss": {"stem": "the name is doing a lot of work. no buds anywhere on it.", "leaves": "solid all the way through. no layers."}, "pot": "kamote cue (fried on a stick with caramelised sugar, ph), kolak (in coconut milk and palm sugar, id), roasted in a drum on the street.", "sure": [[3, "the orange ones are full of beta-carotene, which your body turns into vitamin a."]], "safe": "", "line": "a root, pretending to be a tuber, pretending to be a potato. it's right there in the name."}, {"id": "shallot", "name": "shallot", "kind": "leaves", "sub": "a bulb: a stack of fat leaves on a very short stem", "names": ["bawang merah (id, my)", "hom daeng (th)", "sibuyas tagalog (ph)", "hành tím (vn)"], "marks": [{"x": 640, "y": 300, "r": 40, "t": "leaves", "lx": 480, "ly": 200}, {"x": 640, "y": 455, "r": 30, "t": "the stem", "lx": 490, "ly": 520}], "tell": "cut it in half. every ring is a leaf, fat with stored food, wrapped round the next one. the actual stem is that flat little plate at the bottom with the roots coming out of it.", "miss": {"stem": "there is a stem in there. it's the plate at the bottom, about as thick as a coin. the rest is leaves.", "root": "the roots are the hairs at the bottom. the bulb is leaves."}, "pot": "fried crisp and scattered over nearly everything. pounded raw into sambal and curry pastes.", "sure": [[1, "flavour, mostly. the health studies on onions and shallots are small and mixed."]], "safe": "", "line": "a stack of leaves standing on a stem the size of a coin. nobody has to know."}, {"id": "ginger", "name": "ginger", "kind": "stem", "sub": "a rhizome: a stem that grows sideways under the soil", "names": ["jahe (id)", "halia (my)", "khing (th)", "luya (ph)", "gừng (vn)"], "marks": [{"x": 600, "y": 380, "r": 34, "t": "rings", "lx": 690, "ly": 500}, {"x": 395, "y": 188, "r": 26, "t": "a bud", "lx": 255, "ly": 170}], "tell": "rings. each ring is a node, where a little scale leaf used to be, and the knobs end in buds. it keeps branching sideways, which roots don't do like this.", "miss": {"root": "everyone calls it ginger root. it's the stem. the roots are the hairs, and they get trimmed off before market.", "leaves": "solid. the leaves were the rings, once, very small."}, "pot": "wedang jahe (java), salabat (ph), nam khing (th): sliced or smashed, simmered, sweetened.", "sure": [[2, "nausea in pregnancy: it may help."], [1, "motion sickness: most studies didn't find it helped. the reputation is bigger than the evidence."]], "safe": "as pills it can give some people heartburn or an upset stomach.", "line": ""}, {"id": "galangal", "name": "galangal", "kind": "stem", "sub": "a rhizome, harder and louder than ginger", "names": ["lengkuas (id, my)", "kha (th)", "langkawas (ph)", "riềng (vn)"], "marks": [{"x": 300, "y": 385, "r": 36, "t": "rings", "lx": 170, "ly": 500}, {"x": 575, "y": 205, "r": 26, "t": "a bud", "lx": 690, "ly": 175}], "tell": "the loudest rings in the market. dark, close, every one a node. the pink tips are buds about to be shoots.", "miss": {"root": "it has rings and buds. that's a stem lying down.", "leaves": "no layers. cut it and it's dense, woody, smells of pine."}, "pot": "the kha in tom kha. in rendang, soto, curry pastes. you slice it. grating it is a long afternoon.", "sure": [[1, "lots of lab and animal studies. very few in people. nobody knows yet."]], "safe": "", "line": "coiner calls it the new ginger. galangal has accepted the title."}, {"id": "turmeric", "name": "turmeric", "kind": "stem", "sub": "a rhizome: a mother and her fingers", "names": ["kunyit (id, my)", "khamin (th)", "luyang dilaw (ph)", "nghệ (vn)"], "marks": [{"x": 455, "y": 335, "r": 34, "t": "rings", "lx": 560, "ly": 230}, {"x": 735, "y": 470, "r": 60, "t": "inside", "lx": 600, "ly": 545}], "tell": "rings on every finger, and a fat mother where they start. all stem. inside is the orange that stains every cutting board in asia.", "miss": {"root": "it has rings. rings mean stem. the roots are the hairs underneath.", "leaves": "solid and orange all the way through."}, "pot": "kunyit asam: turmeric and tamarind, the jamu that used to come round in a basket on someone's back.", "sure": [[2, "knee arthritis pain: several reviews look promising. still being argued."], [1, "almost everything else you'll read about it: not shown yet."]], "safe": "the spice in food is one thing. the high-absorption curcumin pills have been linked to liver injury. not the same thing.", "line": ""}, {"id": "lotus", "name": "lotus root", "kind": "stem", "sub": "a rhizome buried in mud", "names": ["akar teratai (my)", "rak bua (th)", "củ sen (vn)", "lián ǒu (zh)"], "marks": [{"x": 406, "y": 284, "r": 30, "t": "a node", "lx": 260, "ly": 400}, {"x": 760, "y": 445, "r": 86, "t": "air pipes", "lx": 580, "ly": 530}], "tell": "it's a string of sausages, and every pinch is a node with roots and a leaf coming off it. every language at the market calls it a root. every language is wrong. the holes are air pipes, so a stem buried in mud can breathe.", "miss": {"root": "you and every market in asia. it's a stem, and the pinches give it away.", "leaves": "those holes are tempting. they're pipes, not layers."}, "pot": "sliced thin into soups and stir-fries, stuffed with sticky rice, braised. the holes hold sauce.", "sure": [[3, "an honest vegetable: fibre and vitamin c."]], "safe": "", "line": "the holes aren't decoration. they're for breathing. i have been asked to stop staring at them."}, {"id": "cassava", "name": "cassava", "kind": "root", "sub": "a tuberous root", "names": ["singkong, ubi kayu (id)", "ubi kayu (my)", "man sampalang (th)", "kamoteng kahoy (ph)", "khoai mì (vn)"], "marks": [{"x": 440, "y": 300, "r": 40, "t": "no rings, no buds", "lx": 420, "ly": 210}, {"x": 815, "y": 362, "r": 26, "t": "a tail", "lx": 780, "ly": 440}], "tell": "no rings, no buds, just bark and a tail. it's a root, packed with starch. farmers grow new plants from stem cuttings, not from these, because a root has no buds to grow from.", "miss": {"stem": "it's the size of a log, but there are no buds anywhere on it. root.", "leaves": "solid starch all the way through."}, "pot": "tapioca, getuk, cassava cake, chips, tapai (fermented, a little boozy).", "sure": [[3, "energy, lots of it. very little protein."]], "safe": "raw cassava makes cyanide. peel it, soak it, cook it right through. the bitter kinds need more of all three. no joke on this one.", "line": ""}, {"id": "fingerroot", "name": "fingerroot", "kind": "root", "half": "stem", "sub": "a small rhizome knob, hung with swollen roots", "names": ["temu kunci (id, my)", "krachai (th)", "chinese keys (en)"], "marks": [{"x": 462, "y": 212, "r": 46, "t": "stem", "lx": 330, "ly": 120}, {"x": 476, "y": 430, "r": 36, "t": "roots", "lx": 620, "ly": 470}], "tell": "the twist. the little knob at the top, with rings and shoots, is a stem. the fingers hanging off it have no rings and no buds, and botanical descriptions call them swollen roots. plenty of cookbooks call the whole thing a rhizome. both are holding half of it. the part you pay for is mostly root: the one ginger whose name tells the truth.", "miss": {"stem": "the knob is a stem. the fingers you buy are roots.", "leaves": "no layers. it's a little stem with a lot of roots."}, "pot": "kaeng pa (jungle curry), fish curries, the sauce on khanom jeen, pickled.", "sure": [[1, "in 2020 a lab study found its extract stopped the covid virus in test tubes. in thailand the price went from 30 to 80 baht a kilo to 120 and up. the university put out a statement saying the adverts were nothing to do with them. in people: nobody knows yet."]], "safe": "", "line": ""}];

function start(){
  const first=CARDS.slice(0,3), last=CARDS.find(c=>c.id==='fingerroot');
  const mid=CARDS.slice(3).filter(c=>c!==last); const r=rng(Date.now()&0xffff);
  for(let i=mid.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[mid[i],mid[j]]=[mid[j],mid[i]];}

}
function intro(){
  $('#app').innerHTML=`<div class="kicker">a digging game · for coiner</div><h1>stem, root or leaf</h1>
  <p>a sack from the market. things come out of it one at a time. each one grew underground, and you say what it actually is: a stem lying down, a root, or leaves.</p>
  <p>it's harder than it sounds, because almost everyone at the market is lying. mostly by accident.</p>
  <div class="lab">how sure is anyone</div>
  <div class="legend">${LEG.map(([n,t])=>`<div>${eyes(n)}<span>${t}</span></div>`).join('')}</div>
  <p class="legend" style="margin-top:10px">the health bits say how much is actually known, which is often less than the internet says. people have drunk these teas for hundreds of years. that's real too. it just isn't the same thing as knowing what they do.</p>
  <button class="next" id="go">open the sack</button>`;
  $('#go').onclick=start;
}
function marksSVG(c,FS){

  c.marks.forEach((m,k)=>{
    let d='',ph=k*2.1+c.id.length; const N=46, a0=-1.9+k;
    for(let i=0;i<=N;i++){const t=i/N, a=a0+t*(Math.PI*2+0.5), rr=m.r*(1+0.07*Math.sin(3*a+ph))*(1+0.06*t);
      d+=(i?'L':'M')+(m.x+Math.cos(a)*rr*1.08).toFixed(1)+' '+(m.y+Math.sin(a)*rr*0.92).toFixed(1);}
    // leader from label to the circle's edge
    const dx=m.x-m.lx, dy=m.y-(m.ly-FS*0.35), L=Math.hypot(dx,dy)||1;
    const ex=m.x-dx/L*m.r*1.12, ey=m.y-dy/L*m.r*1.0;
    const sx=m.lx+dx/L*Math.min(FS*1.1, L*0.3), sy=(m.ly-FS*0.35)+dy/L*FS*0.9;
    const near=Math.hypot(ex-m.lx,ey-m.ly)<m.r*0.6+FS;
    s+=`<path class="draw" pathLength="1" d="${d}" style="animation-delay:${k*0.25}s"/>`;
    if(!near && L>m.r*1.3) s+=`<path class="draw" pathLength="1" d="M${sx.toFixed(1)} ${sy.toFixed(1)} Q${((sx+ex)/2+dy*0.08).toFixed(1)} ${((sy+ey)/2-dx*0.08).toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" style="animation-delay:${k*0.25+0.3}s"/>`;
    s+=`<text x="${m.lx}" y="${m.ly}" text-anchor="middle" font-size="${FS}" style="animation-delay:${k*0.25+0.45}s">${m.t}</text>`;
  });
  return s+'</svg>';
}
function show(){
  if(idx>=order.length) return ledger();
  const c=order[idx];
  $('#app').innerHTML=`<div class="kicker">out of the sack · ${idx+1} of ${order.length}</div>
  <div class="card" id="card">
   <div class="plate"><div class="pw" id="pw"><img src="${IMG[c.id]}" alt="${c.name}, drawn as a hand-coloured plate"></div></div>
   <div class="trow"><h2>${c.name}</h2><span id="st"></span></div><div class="names">${c.names.join(' · ')}</div>
   <div class="ask"><div class="q">what is it, really?</div>
    <div class="btns">${['stem','root','leaves'].map(k=>`<button data-k="${k}">${ICON[k]}<span>${SAID[k]}</span></button>`).join('')}</div>
    ${idx<3?`<p class="hint">${['look for buds: eyes, rings, little pointed shoots. buds in rows mean stem.','roots don\u2019t have buds in rows. they have hairs, and a tail.','leaves come in layers.'][idx]}</p>`:''}
   </div>
   <div class="reveal" id="rev"></div>
  </div>`;
  document.querySelectorAll('.btns button').forEach(b=>b.onclick=()=>answer(c,b.dataset.k));
  window.scrollTo({top:0});
}
function answer(c,k){
  const res = k===c.kind?'ok':(c.half===k?'half':'no');
  ans.push({c,k,res});
  const im=$('#pw img'), sc=(im.getBoundingClientRect().width||1)/CROPS[c.id][2];
  $('#pw').insertAdjacentHTML('beforeend',marksSVG(c,Math.max(FS,13.5/sc)));
  $('#st').innerHTML=`<div class="stamp">${KIND[c.kind]}</div>`;
  const head={ok:'right.',half:'half right.',no:'not quite.'}[res];
  const miss= res==='ok'?'':(c.miss[k]||'');
  $('#rev').innerHTML=`<div class="verdict ${res}">${head}</div>${miss?`<p>${miss}</p>`:''}
   <p class="sub">${c.sub}.</p>
   <div class="lab">the tell</div><p>${c.tell}</p>
   <div class="lab">in the pot, or the cup</div><p>${c.pot}</p>
   <div class="lab">how sure is anyone</div>${c.sure.map(([n,t])=>`<div class="gauge">${eyes(n)}<p>${t}</p></div>`).join('')}
   ${c.safe?`<div class="careful"><div class="lab" style="margin-top:0">careful</div><p>${c.safe}</p></div>`:''}
   ${c.line?`<p class="aside">${c.line}</p>`:''}
   <button class="next" id="nx">${idx+1<order.length?'next one out of the sack':'the sack is empty'}</button>`;
  $('#card').classList.add('answered');
  $('#nx').onclick=()=>{idx++;show();};
}
function ledger(){
  const n={stem:0,root:0,leaves:0}; let score=0;
  ans.forEach(a=>{n[a.c.kind]++; score+= a.res==='ok'?1:a.res==='half'?0.5:0;});
  const sc=(score%1?Math.floor(score)+'\u00bd':score);
  $('#app').innerHTML=`<div class="kicker">the ledger</div><h1>the sack is empty</h1>
  <div class="tally">stems ${n.stem} · roots ${n.root} · leaves ${n.leaves}</div>
  <p>you called ${sc} of ${ans.length}. </p>
  <table>${ans.map(a=>`<tr><td>${a.c.name}</td><td>you said ${SAID[a.k]}</td><td class="r ${a.res}">${KIND[a.c.kind]}</td></tr>`).join('')}</table>
  <p>most of what grows underground isn't a root. it's stem, lying down and storing lunch, and the buds give it away every time.</p>
  <p>more things go in the sack when coiner's back from the market.</p>
  <button class="next" id="again">tip it out again</button>
  <footer>every plate here was drawn by a program i wrote: shapes as distance fields, then a watercolour wash and engraving ink, all computed. no image generator. health notes lean on the US NCCIH fact sheets for ginger and turmeric and on the 2020 to 2021 reporting from thailand about krachai. if something's wrong, tell me and it gets fixed. — spudnik</footer>`;
  $('#again').onclick=start; window.scrollTo({top:0});
}
intro();
</script></body></html>
